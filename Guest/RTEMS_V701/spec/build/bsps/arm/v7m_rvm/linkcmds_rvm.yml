build-type: config-file
content: |
  OUTPUT_ARCH(arm)
  ENTRY(__RVM_Entry)

  MEMORY
  {
    DESC (r)  : ORIGIN = ${RVM_CODE_BASE}, LENGTH = 0x20
    CODE (rx) : ORIGIN = ${RVM_CODE_BASE} + 0x20,
                LENGTH = ${RVM_CODE_SIZE} - 0x20
    DATA (rw) : ORIGIN = ${RVM_DATA_BASE}, LENGTH = ${RVM_DATA_SIZE}
  }

  __RVM_Stack = ${RVM_USER_STACK_TOP};

  SECTIONS
  {
    .PROCESS_DESC : ALIGN(4)
    {
      KEEP(*(.PROCESS_DESC))
      KEEP(*(.PROCESS_DESC.*))
      KEEP(*rte_entry_desc*.o(.rodata .rodata.*))
    } > DESC

    .PROCESS_CODE : ALIGN(4)
    {
      __RVM_Code_Start = .;
      bsp_section_text_begin = .;
      *(.text .text.*)
      bsp_section_text_end = .;
      bsp_section_text_size = bsp_section_text_end - bsp_section_text_begin;
      bsp_section_text_load_begin = LOADADDR(.PROCESS_CODE);
      bsp_section_text_load_end = bsp_section_text_load_begin + bsp_section_text_size;

      bsp_section_rodata_begin = .;
      *(.rodata .rodata.* .constdata .constdata.*)
      *(.rodata1)
      *(.ARM.extab* .gnu.linkonce.armextab.*)
      __exidx_start = .;
      *(.ARM.exidx* .gnu.linkonce.armexidx.*)
      __exidx_end = .;
      KEEP(*(.eh_frame))
      *(.gcc_except_table .gcc_except_table.*)
      *(.data.rel.ro.local* .gnu.linkonce.d.rel.ro.local.*)
      *(.data.rel.ro .data.rel.ro.* .gnu.linkonce.d.rel.ro.*)
      KEEP(*(.jcr))
      *(.interp)
      *(.note.gnu.build-id)
      *(.note.GNU-stack)
      *(.got.plt) *(.igot.plt) *(.got) *(.igot)
      KEEP(*(SORT(.rtemsroset.*)))
      . = ALIGN(4);
      bsp_section_rodata_end = .;
      bsp_section_rodata_size = bsp_section_rodata_end - bsp_section_rodata_begin;
      bsp_section_rodata_load_begin = LOADADDR(.PROCESS_CODE);
      bsp_section_rodata_load_end = bsp_section_rodata_load_begin + bsp_section_rodata_size;
    } > CODE

    .init : ALIGN(4)
    {
      KEEP(*(.init))
    } > CODE

    .fini : ALIGN(4)
    {
      KEEP(*(.fini))
    } > CODE

    .preinit_array : ALIGN(4)
    {
      PROVIDE_HIDDEN(__preinit_array_start = .);
      KEEP(*(.preinit_array))
      PROVIDE_HIDDEN(__preinit_array_end = .);
    } > CODE

    .init_array : ALIGN(4)
    {
      PROVIDE_HIDDEN(__init_array_start = .);
      KEEP(*(SORT_BY_INIT_PRIORITY(.init_array.*)
             SORT_BY_INIT_PRIORITY(.ctors.*)))
      KEEP(*(.init_array EXCLUDE_FILE(*crtbegin.o *crtbegin?.o
             *crtend.o *crtend?.o) .ctors))
      PROVIDE_HIDDEN(__init_array_end = .);
    } > CODE

    .fini_array : ALIGN(4)
    {
      PROVIDE_HIDDEN(__fini_array_start = .);
      KEEP(*(SORT_BY_INIT_PRIORITY(.fini_array.*)
             SORT_BY_INIT_PRIORITY(.dtors.*)))
      KEEP(*(.fini_array EXCLUDE_FILE(*crtbegin.o *crtbegin?.o
             *crtend.o *crtend?.o) .dtors))
      PROVIDE_HIDDEN(__fini_array_end = .);
    } > CODE

    .tdata : ALIGN(4)
    {
      _TLS_Data_begin = .;
      *(.tdata .tdata.* .gnu.linkonce.td.*)
      _TLS_Data_end = .;
    } > CODE

    .tbss (NOLOAD) : ALIGN(4)
    {
      _TLS_BSS_begin = .;
      *(.tbss .tbss.* .gnu.linkonce.tb.*) *(.tcommon)
      _TLS_BSS_end = .;
    } > CODE

    __RVM_Code_End = .;

    _TLS_Data_size = _TLS_Data_end - _TLS_Data_begin;
    _TLS_Data_begin = _TLS_Data_size != 0 ? _TLS_Data_begin : _TLS_BSS_begin;
    _TLS_Data_end = _TLS_Data_size != 0 ? _TLS_Data_end : _TLS_BSS_begin;
    _TLS_BSS_size = _TLS_BSS_end - _TLS_BSS_begin;
    _TLS_Size = _TLS_BSS_end - _TLS_Data_begin;
    _TLS_Alignment = MAX(ALIGNOF(.tdata), ALIGNOF(.tbss));

    .PROCESS_DATA : ALIGN(4)
    {
      FILL(0xFF)
      bsp_section_data_begin = .;
      __RVM_Data_Start = .;
      *(.data .data.* .gnu.linkonce.d.*)
      SORT(CONSTRUCTORS)
      *(.data1)
      KEEP(*(SORT(.rtemsrwset.*)))
      . = ALIGN(4);
      __RVM_Data_End = .;
      bsp_section_data_end = .;
    } > DATA AT > CODE

    __RVM_Data_Load = LOADADDR(.PROCESS_DATA);
    bsp_section_data_size = bsp_section_data_end - bsp_section_data_begin;
    bsp_section_data_load_begin = __RVM_Data_Load;
    bsp_section_data_load_end = bsp_section_data_load_begin + bsp_section_data_size;

    .PROCESS_ZERO (NOLOAD) : ALIGN(4)
    {
      bsp_section_bss_begin = .;
      __RVM_Zero_Start = .;
      *(.dynbss)
      *(.bss .bss.* .gnu.linkonce.b.*)
      *(COMMON)
      . = ALIGN(4);
      __RVM_Zero_End = .;
      bsp_section_bss_end = .;
      bsp_section_bss_size = bsp_section_bss_end - bsp_section_bss_begin;
    } > DATA

    .PROCESS_NOINIT (NOLOAD) : ALIGN(4)
    {
      bsp_section_noinit_begin = .;
      __RVM_Noinit_Start = .;
      *(.noinit .noinit.*)
      . = ALIGN(4);
      __RVM_Noinit_End = .;
      bsp_section_noinit_end = .;
      bsp_section_noinit_size = bsp_section_noinit_end - bsp_section_noinit_begin;
    } > DATA

    .rtemsstack (NOLOAD) : ALIGN(4)
    {
      bsp_section_rtemsstack_begin = .;
      *(SORT_BY_ALIGNMENT(SORT_BY_NAME(.rtemsstack*)))
      bsp_section_rtemsstack_end = .;
      bsp_section_rtemsstack_size =
        bsp_section_rtemsstack_end - bsp_section_rtemsstack_begin;
    } > DATA

    bsp_section_stack_begin = .;
    bsp_section_stack_end = .;
    bsp_section_stack_size = 0;

    .work (NOLOAD) : ALIGN(4)
    {
      bsp_section_work_begin = .;
      . += ORIGIN(DATA) + LENGTH(DATA) - ABSOLUTE(.);
      bsp_section_work_end = .;
      bsp_section_work_size = bsp_section_work_end - bsp_section_work_begin;
    } > DATA

    RamBase = ORIGIN(DATA);
    RamSize = LENGTH(DATA);
    RamEnd = RamBase + RamSize;
    WorkAreaBase = bsp_section_work_begin;
    HeapSize = 0;

    __bss_start = __RVM_Zero_Start;
    __bss_end = __RVM_Zero_End;
    end = __RVM_Zero_End;
    _end = __RVM_Zero_End;
    __end = __RVM_Zero_End;
    __end__ = __RVM_Zero_End;

    _ISR_Stack_area_begin = __RVM_Zero_End;
    _ISR_Stack_size = 0;
  }
